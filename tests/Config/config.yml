workflows:
  - code: application
    title: Antrag
    class: Atwx\Flow\Tests\Stubs\TestApplication
    initial_status: received
    roles:
      - code: clerk
        title: Sachbearbeitung
        group: clerks
    phases:
      - code: intake
        title: Eingang
    statuses:
      - code: received
        title: Eingegangen
        phase: intake
      - code: approved
        title: Bewilligt
        phase: intake
        final: true
    transitions:
      - from: received
        to: approved
        roles: [clerk]
    field_groups: []
    custom_fields: []
    permissions: []
  - code: course
    title: Kurs
    class: Atwx\Flow\Tests\Stubs\TestCourse
    initial_status: draft
    roles:
      - code: organisers
        title: Organisation
        group: organisers
      - code: readers
        title: Lesend
        group: readers
      - code: speaker
        title: 'Referent:in'
        external: true
    responsibilities:
      - code: lead
        title: Leitung
        role: organisers
    phases:
      - code: planning
        title: Planung
      - code: execution
        title: Durchführung
    statuses:
      - code: draft
        title: Entwurf
        phase: planning
      - code: with_speaker
        title: 'Bei Referent:in'
        phase: planning
      - code: review
        title: 'In Prüfung'
        phase: planning
      - code: done
        title: Abgeschlossen
        phase: execution
        final: true
    transitions:
      - from: draft
        to: with_speaker
        title: 'An Referent:in senden'
        roles: [organisers]
      - from: with_speaker
        to: review
        title: 'Fertig, an Organisation zurück'
        roles: [speaker]
      - from: review
        to: done
        roles: [organisers]
    field_groups:
      - code: basics
        title: Eckdaten
      - code: announcement
        title: Ausschreibung
      - code: organisation
        title: Organisation
    custom_fields:
      - code: audience
        title: Zielgruppe
        type: select
        group: announcement
        options: { beginners: Einsteiger, advanced: Fortgeschrittene }
        list: true
      - code: certificate
        title: Zertifikat
        type: checkbox
        group: announcement
    documents:
      - code: confirmation
        title: Bestätigung
        document_title: 'Bestätigung {{Title}}'
        body: '<p>Der Kurs {{Title}} in {{Venue}} hat den Status {{Status}}.</p>'
    follow_ups:
      - code: chase_speaker
        title: 'Referent:in nachfassen'
        status: with_speaker
        days: 7
        responsibility: lead
    checklist:
      - code: room
        title: 'Raum gebucht'
        required_before: done
      - code: certificate
        title: Teilnahmebescheinigungen
        file: required
    mails:
      - code: confirmation
        title: 'Bestätigung senden'
        subject: 'Bestätigung: {{Title}}'
        to: 'Assignee.lead, info@example.org'
        cc: Me
        body: "Der Kurs {{Title}} hat den Status {{Status}}.\nBis bald!"
        attach: [confirmation]
      - code: closed
        title: Abschlussmeldung
        subject: 'Abgeschlossen: {{Title}}'
        to: info@example.org
        body: 'Der Kurs {{Title}} ist abgeschlossen.'
        send_on: done
      - code: participants
        title: 'Info an Teilnehmende'
        subject: '{{Title}}: Info für {{Item.Name}}'
        for_each: Participants
        to: Item.Email
        cc: Me
        body: "Hallo {{Item.Name}},\nder Kurs {{Title}} findet in {{Venue}} statt."
    permissions:
      - group: basics
        role: organisers
        level: write
      - group: basics
        role: readers
        level: read
      - group: basics
        role: speaker
        level: read
      - group: announcement
        role: organisers
        level: write
      - group: announcement
        role: organisers
        status: done
        level: read
      - group: announcement
        role: readers
        level: read
      - group: announcement
        role: speaker
        level: read
      - group: announcement
        role: speaker
        status: with_speaker
        level: write
      - group: announcement
        role: speaker
        status: done
        level: hidden
      - group: organisation
        role: organisers
        level: write
      - group: organisation
        role: readers
        level: read
