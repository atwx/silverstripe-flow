---
Name: silverstripe-flow
---
# Module configuration for atwx/silverstripe-flow.


SilverStripe\Core\Injector\Injector:
  Atwx\Flow\Document\PdfRenderer:
    class: Atwx\Flow\Document\HeadlessPdfRenderer

Atwx\SilverstripeFrontdeskKit\Catalog\Catalogs:
  extensions:
    - Atwx\Flow\Extension\CatalogUsageExtension
  catalogs:
    flow_comment_type: { title: 'Kommentartypen' }

SilverStripe\Cli\Sake:
  commands:
    'flow:import-config': Atwx\Flow\Cli\ImportConfigCommand
    'flow:export-config': Atwx\Flow\Cli\ExportConfigCommand
    'flow:cleanup-data': Atwx\Flow\Cli\CleanupDataCommand
    'flow:followup-digest': Atwx\Flow\Cli\FollowUpDigestCommand

SilverStripe\Security\Member:
  extensions:
    - Atwx\Flow\Extension\FlowMemberExtension

---
Name: silverstripe-flow-routes
After:
  - '#rootroutes'
  - '#coreroutes'
---
SilverStripe\Control\Director:
  rules:
    'flow/link': Atwx\Flow\Controller\AccessLinkController
    'flow/download': Atwx\Flow\Controller\MailDownloadController
    'flow-api': Atwx\Flow\Api\ApiController
