name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint, analyse, test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SS_ENVIRONMENT_TYPE: dev
      SS_DATABASE_CLASS: MySQLDatabase
      SS_DATABASE_SERVER: 127.0.0.1
      SS_DATABASE_PORT: 3306
      SS_DATABASE_USERNAME: root
      SS_DATABASE_PASSWORD: root
      SS_DATABASE_NAME: ss_flow_test

    steps:
      # Same layout as the local workspace: the kit is a Composer path
      # repository at ../silverstripe-frontdesk-kit (dev-main).
      - name: Checkout module
        uses: actions/checkout@v4
        with:
          path: silverstripe-flow

      - name: Checkout frontdesk-kit
        uses: actions/checkout@v4
        with:
          repository: atwx/silverstripe-frontdesk-kit
          ref: main
          path: silverstripe-frontdesk-kit

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_mysql, mysqli, gd, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: silverstripe-flow
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPCS
        working-directory: silverstripe-flow
        run: composer lint

      - name: PHPStan
        working-directory: silverstripe-flow
        run: composer phpstan -- --no-progress

      - name: PHPUnit
        working-directory: silverstripe-flow
        run: composer test
